    // Fast image compression that never hangs
    const compressReceiptImage = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 800;
              const scale = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
              canvas.width = Math.round(img.width * scale);
              canvas.height = Math.round(img.height * scale);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
              if (typeof canvas.toBlob === 'function') {
                canvas.toBlob(
                  (blob) => resolve({ dataUrl, blob }),
                  'image/jpeg',
                  0.72
                );
              } else {
                resolve({ dataUrl, blob: null });
              }
            } catch (err) {
              reject(err);
            }
          };
          img.onerror = reject;
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    };

    // Non-blocking background cloud upload with strict 4.5s timeout so the app NEVER freezes
    const uploadReceiptWithTimeout = async (blob, filename = 'receipt.jpg') => {
      if (!blob) return null;

      const fetchWithTimeout = async (url, options, ms = 4500) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), ms);
        try {
          const res = await fetch(url, { ...options, signal: controller.signal });
          clearTimeout(timer);
          return res;
        } catch (err) {
          clearTimeout(timer);
          throw err;
        }
      };

      try {
        const form2 = new FormData();
        form2.append('file', blob, filename);
        const res2 = await fetchWithTimeout('https://tmpfiles.org/api/v1/upload', {
          method: 'POST',
          body: form2
        });
        if (res2 && res2.ok) {
          const json = await res2.json();
          const rawUrl = json?.data?.url;
          if (rawUrl) {
            return rawUrl.replace('https://tmpfiles.org/', 'https://tmpfiles.org/dl/');
          }
        }
      } catch (e) {}

      try {
        const form1 = new FormData();
        form1.append('reqtype', 'fileupload');
        form1.append('time', '72h');
        form1.append('fileToUpload', blob, filename);
        const res1 = await fetchWithTimeout('https://litterbox.catbox.moe/resources/internals/api.php', {
          method: 'POST',
          body: form1
        });
        if (res1 && res1.ok) {
          const textUrl = (await res1.text()).trim();
          if (textUrl.startsWith('http')) return textUrl;
        }
      } catch (e) {}

      return null;

          const shortKey = e.key.replace('bonka_local_', '');
          try {
            const parsed = JSON.parse(e.newValue);
            applySyncUpdate(shortKey, parsed);
          } catch (err) {}
        };

        const handleBroadcastMessage = (e) => {
          if (e && e.data && e.data.key) {
            applySyncUpdate(e.data.key, e.data.data);
          }
        };

        window.addEventListener('storage', handleStorageEvent);
        if (syncChannel) {
          try {
            syncChannel.addEventListener('message', handleBroadcastMessage);
          } catch (e) {
            syncChannel.onmessage = handleBroadcastMessage;
          }
        }

        return () => {
          window.removeEventListener('storage', handleStorageEvent);
          if (syncChannel) {
            try {

            } catch (e) {
              syncChannel.onmessage = null;

      const filteredGames = useMemo(() => {
        return games
          .filter((game) => {
            const matchesSearch =
              game.title?.toLowerCase().includes(searchQuery.toLowerCase()) ||
              game.genre?.toLowerCase().includes(searchQuery.toLowerCase()) ||
              game.description?.toLowerCase().includes(searchQuery.toLowerCase());

            const matchesConsole =
              consoleFilter === 'ALL' ||
              (consoleFilter === 'PS5' && game.console?.includes('PS5')) ||
              (consoleFilter === 'PS4' && game.console?.includes('PS4'));

            const matchesGenre = genreFilter === 'ALL' || game.genre === genreFilter;

            return matchesSearch && matchesConsole && matchesGenre;
          })
          .sort((a, b) => {
            const priceA = globalLicensePreference === 'Primary' ? a.primaryPrice : a.secondaryPrice;
            const priceB = globalLicensePreference === 'Primary' ? b.primaryPrice : b.secondaryPrice;

                      </button>
                      {checkoutForm.receiptImage && (
                        <img src={checkoutForm.receiptImage} alt="receipt" className="max-h-40 rounded-xl border border-white/10 mx-auto" />
                      )}
                    </div>

                    <button
                      type="submit"
                      disabled={submittingOrder || cart.length === 0}
                      className={`w-full py-3 rounded-2xl text-sm font-bold flex items-center justify-center gap-2 transition-all ${
                        submittingOrder || cart.length === 0
                          ? 'bg-slate-800 text-slate-500 cursor-not-allowed'
                          : 'bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white shadow-lg shadow-blue-600/25'
                      }`}
                    >
                      {submittingOrder ? <RefreshCw className="w-4 h-4 animate-spin" /> : <CheckCircle2 className="w-4 h-4" />}
                      <span>{submittingOrder ? tr('جاري التسجيل...', 'Submitting...') : tr('تأكيد الطلب', 'Place Order')}</span>
                    </button>
                  </form>
                </div>
              )}

              {/* Post-Order Modal */}
              {postOrderModal && (
                <div className="fixed inset-0 z-[80] flex items-center justify-center p-4">
                  <div className="absolute inset-0 bg-black/75 backdrop-blur-sm" onClick={() => setPostOrderModal(null)} />
                  <div className="relative z-10 w-full max-w-md rounded-3xl bg-slate-950 border border-emerald-500/30 p-6 text-center space-y-4">
                    <CheckCircle2 className="w-14 h-14 text-emerald-400 mx-auto" />
                    <h3 className="text-xl font-black text-white">{tr('تم تسجيل طلبك!', 'Order Created!')}</h3>
                    <p className="text-sm text-slate-300">
                      {tr('رقم طلبك:', 'Your order number:')} <span className="font-mono font-bold text-cyan-400">{postOrderModal.orderNumber}</span>
                    </p>
                    <p className="text-xs text-slate-400 leading-relaxed">
                      {tr('أرسل رقم الطلب وصورة التحويل للإدارة عبر واتساب أو ماسنجر لاستلام حسابك فوراً.', 'Send your order number and receipt via WhatsApp or Messenger to receive your account.')}
                    </p>
                    <div className="flex flex-col sm:flex-row gap-2">
                      <button
                        onClick={() => handleConfirmViaWhatsApp(postOrderModal)}
                        className="flex-1 flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition-all"
                      >
                        <PhoneCall className="w-4 h-4" />
                        <span>{tr('واتساب', 'WhatsApp')}</span>
                      </button>
                      <button
                        onClick={() => handleConfirmViaMessenger(postOrderModal)}
                        className="flex-1 flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition-all"
                      >
                        <MessageCircle className="w-4 h-4" />
                        <span>{tr('ماسنجر', 'Messenger')}</span>
                      </button>
                    </div>
                    <button onClick={() => setPostOrderModal(null)} className="text-xs text-slate-400 hover:text-white">
                      {tr('إغلاق', 'Close')}
                    </button>
                  </div>
                </div>
              )}

              {/* Game Details Modal */}
              {selectedGameModal && (
                <div className="fixed inset-0 z-[70] flex items-center justify-center p-4">
                  <div className="absolute inset-0 bg-black/75 backdrop-blur-sm" onClick={() => setSelectedGameModal(null)} />
                  <div className="relative z-10 w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-3xl bg-slate-950 border border-white/10 overflow-hidden">
                    <div className="relative h-56 bg-slate-900">
                      <img
                        src={selectedGameModal.image}
                        alt={selectedGameModal.title}
                        onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/600x400/0f172a/38bdf8?text=PlayStation+Game'; }}
                        className="w-full h-full object-cover"
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-slate-950 to-transparent" />
                      <button
                        onClick={() => setSelectedGameModal(null)}
                        className="absolute top-3 right-3 p-2 rounded-xl bg-slate-950/80 text-slate-200 hover:bg-rose-600 transition-colors"
                      >
                        <X className="w-4 h-4" />
                      </button>
                    </div>
                    <div className="p-6 space-y-3">
                      <h3 className="text-xl font-black text-white">{selectedGameModal.title}</h3>
                      <div className="flex flex-wrap items-center gap-2 text-[11px] font-bold">
                        <span className="px-2.5 py-1 rounded-lg bg-white/10 text-white">{selectedGameModal.console}</span>
                        <span className="px-2.5 py-1 rounded-lg bg-blue-500/15 text-blue-300">{selectedGameModal.genre}</span>
                        <span className="px-2.5 py-1 rounded-lg bg-amber-500/15 text-amber-300">★ {selectedGameModal.rating}</span>
                        <span className="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300">{selectedGameModal.releaseYear}</span>
                      </div>
                      <p className="text-sm text-slate-300 leading-relaxed">{selectedGameModal.description}</p>
                      <div className="grid grid-cols-2 gap-3 pt-2">
                        <button
                          disabled={Number(selectedGameModal.primaryStock) <= 0}
                          onClick={() => { addToCart(selectedGameModal, 'Primary'); setSelectedGameModal(null); }}
                          className={`p-3 rounded-2xl text-xs font-bold transition-all ${
                            Number(selectedGameModal.primaryStock) <= 0 ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-blue-600/20 border border-blue-500 text-blue-200 hover:bg-blue-600 hover:text-white'
                          }`}
                        >
                          <div>{tr('أساسي', 'Primary')}</div>
                          <div className="text-sm font-black">{formatEGP(selectedGameModal.primaryPrice, lang)}</div>
                        </button>
                        <button
                          disabled={Number(selectedGameModal.secondaryStock) <= 0}
                          onClick={() => { addToCart(selectedGameModal, 'Secondary'); setSelectedGameModal(null); }}
                          className={`p-3 rounded-2xl text-xs font-bold transition-all ${
                            Number(selectedGameModal.secondaryStock) <= 0 ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-purple-600/20 border border-purple-500 text-purple-200 hover:bg-purple-600 hover:text-white'
                          }`}
                        >
                          <div>{tr('ثانوي', 'Secondary')}</div>
                          <div className="text-sm font-black">{formatEGP(selectedGameModal.secondaryPrice, lang)}</div>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* Delete Game Modal */}
              {gameToDeleteModal && (
                <div className="fixed inset-0 z-[80] flex items-center justify-center p-4">
                  <div className="absolute inset-0 bg-black/75 backdrop-blur-sm" onClick={() => setGameToDeleteModal(null)} />
                  <div className="relative z-10 w-full max-w-sm rounded-3xl bg-slate-950 border border-rose-500/30 p-6 text-center space-y-4">
                    <AlertCircle className="w-12 h-12 text-rose-400 mx-auto" />
                    <h3 className="text-lg font-black text-white">{tr('حذف اللعبة؟', 'Delete this game?')}</h3>
                    <p className="text-sm text-slate-300">{gameToDeleteModal.title}</p>
                    <div className="flex gap-2">
                      <button
                        onClick={() => handleDeleteGame(gameToDeleteModal.id, gameToDeleteModal.title)}
                        className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-bold transition-all"
                      >
                        {tr('حذف', 'Delete')}
                      </button>
                      <button
                        onClick={() => setGameToDeleteModal(null)}
                        className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-bold transition-all"
                      >
                        {tr('إلغاء', 'Cancel')}
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Receipt Preview Modal */}
              {receiptPreviewModal && (
                <div className="fixed inset-0 z-[90] flex items-center justify-center p-4">
                  <div className="absolute inset-0 bg-black/85 backdrop-blur-sm" onClick={() => setReceiptPreviewModal(null)} />
                  <div className="relative z-10 max-w-2xl w-full">
                    <button
                      onClick={() => setReceiptPreviewModal(null)}
                      className="absolute -top-3 -right-3 p-2 rounded-full bg-slate-900 border border-white/20 text-white hover:bg-rose-600 transition-colors z-10"
                    >
                      <X className="w-4 h-4" />
                    </button>
                    <img src={receiptPreviewModal} alt="receipt" className="w-full max-h-[85vh] object-contain rounded-2xl border border-white/10 bg-slate-950" />
                  </div>
                </div>
              )}

              {/* Admin PIN Modal */}
              {adminPinModalOpen && (
                <div className="fixed inset-0 z-[90] flex items-center justify-center p-4">
                  <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={() => { setAdminPinModalOpen(false); setAdminPinInput(''); }} />
                  <form
                    onSubmit={handleAdminUnlockSubmit}
                    className="relative z-10 w-full max-w-sm rounded-3xl bg-slate-950 border border-indigo-500/30 p-6 space-y-4 text-center"
                  >
                    <Lock className="w-10 h-10 text-indigo-400 mx-auto" />
                    <h3 className="text-lg font-black text-white">{tr('الدخول للإدارة', 'Admin Access')}</h3>
                    <input
                      type="password"
                      autoFocus
                      dir="ltr"
                      value={adminPinInput}
                      onChange={(e) => setAdminPinInput(e.target.value)}
                      placeholder={tr('الكود السري', 'Secret code')}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-white/10 text-sm text-white text-center focus:outline-none focus:border-indigo-500"
                    />
                    <button type="submit" className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold transition-all">
                      {tr('دخول', 'Unlock')}
                    </button>
                  </form>
                </div>
              )}

              {/* Manage Order Credentials Modal */}
              {managingOrderModal && (
                <div className="fixed inset-0 z-[80] flex items-center justify-center p-4">
                  <div className="absolute inset-0 bg-black/75 backdrop-blur-sm" onClick={() => setManagingOrderModal(null)} />
                  <form
                    onSubmit={handleSaveDispatchedCredentials}
                    className="relative z-10 w-full max-w-xl max-h-[90vh] overflow-y-auto rounded-3xl bg-slate-950 border border-white/10 p-6 space-y-4"
                  >
                    <div className="flex items-center justify-between">
                      <h3 className="text-lg font-black text-white">
                        {tr('بيانات الطلب', 'Order Credentials')} <span className="font-mono text-cyan-400">{managingOrderModal.orderNumber}</span>
                      </h3>
                      <button type="button" onClick={() => setManagingOrderModal(null)} className="p-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300">
                        <X className="w-4 h-4" />
                      </button>
                    </div>

                    {editableOrderAccounts.map((acc, idx) => (
                      <div key={idx} className="rounded-2xl bg-slate-900 border border-white/10 p-4 space-y-2">
                        <div className="text-sm font-bold text-white">
                          {acc.title} • {acc.licenseType === 'Primary' ? tr('أساسي', 'Primary') : tr('ثانوي', 'Secondary')}
                        </div>
                        {[
                          { key: 'psnEmail', label: 'PSN Email' },
                          { key: 'psnPassword', label: 'PSN Password' },
                          { key: 'twoStepCode', label: '2-Step Code' }
                        ].map((f) => (
                          <input
                            key={f.key}
                            type="text"
                            dir="ltr"
                            placeholder={f.label}
                            value={acc[f.key] || ''}
                            onChange={(e) => handleUpdateOrderCredentialField(idx, f.key, e.target.value)}
                            className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-white/10 text-xs text-white focus:outline-none focus:border-blue-500"
                          />
                        ))}
                      </div>
                    ))}

                    <button type="submit" className="w-full py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold transition-all">
                      {tr('حفظ وإرسال للعميل', 'Save & Send to Customer')}
                    </button>
                  </form>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
